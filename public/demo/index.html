<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Storeline operational intelligence for multi-location hospitality groups." />
    <meta name="theme-color" content="#075d67" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Storeline" />
    <meta property="og:title" content="Storeline — Franchise Intelligence" />
    <meta property="og:description" content="Turn sales, customer reviews, and market context into operating decisions." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Storeline — Franchise Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/brand/storeline-favicon.svg" />
    <link rel="manifest" href="/brand/site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient-network" aria-hidden="true">
      <svg viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
        <g class="network-lines"><path d="M46 144 155 62 278 124 392 46 507 140 625 67 780 144 858 55"/><path d="M31 368 142 270 278 326 389 232 523 318 663 228 837 329"/><path d="M155 62 142 270M278 124 278 326M392 46 389 232M507 140 523 318M625 67 663 228M780 144 837 329"/><path d="M142 270 86 501 265 535 389 232 468 520 663 228 742 501 837 329"/></g>
        <g class="network-dots"><circle cx="46" cy="144" r="3"/><circle cx="155" cy="62" r="4"/><circle cx="278" cy="124" r="3"/><circle cx="392" cy="46" r="3"/><circle cx="507" cy="140" r="5"/><circle cx="625" cy="67" r="3"/><circle cx="780" cy="144" r="4"/><circle cx="31" cy="368" r="4"/><circle cx="142" cy="270" r="5"/><circle cx="523" cy="318" r="4"/><circle cx="663" cy="228" r="5"/><circle cx="742" cy="501" r="5"/></g>
      </svg>
    </div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand" aria-label="Storeline home"><img class="brand-logo" src="/brand/storeline-mark.svg" alt="" /><span>Storeline</span></div>
        <nav class="main-nav" aria-label="Primary navigation">
          <button class="nav-item active" data-view="today"><span class="nav-icon">⌂</span><span>Today</span></button>
          <button class="nav-item" data-view="reviews"><span class="nav-icon">★</span><span>Reviews</span></button>
          <button class="nav-item" data-view="pricing"><span class="nav-icon">$</span><span>Sales</span></button>
          <button class="nav-item" data-view="market"><span class="nav-icon">◎</span><span>Market</span></button>
          <button class="nav-item" data-view="next"><span class="nav-icon">→</span><span>Next steps</span><span class="nav-count" id="decision-count">4</span></button>
          <button class="nav-item" data-view="assistant"><span class="nav-icon">✦</span><span>Ask Storeline</span></button>
        </nav>
        <div class="sidebar-bottom">
          <div class="account-menu" id="account-menu" hidden>
            <div><span class="eyebrow">Workspace</span><strong>Tatte Bakery & Café</strong><small>Boston region · Franchise owner</small></div>
            <button data-account-action="User settings"><span>⚙</span><span><b>User settings</b><small>Profile, alerts and approvals</small></span></button>
            <button data-account-action="Switch user"><span>⇄</span><span><b>Switch user</b><small>Owner, operator or analyst</small></span></button>
            <button data-account-action="Switch geography"><span>⌖</span><span><b>Switch geography</b><small>Boston region</small></span></button>
            <button data-account-action="Data connections"><span>↗</span><span><b>Data connections</b><small>Reviews, sales and market</small></span></button>
          </div>
          <button class="account-card" id="account-button" aria-haspopup="menu" aria-expanded="false"><span class="avatar">TB</span><span><strong>Tatte Bakery & Café</strong><small>Boston intelligence layer</small></span><span class="chevron">⌃</span></button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar"><div class="breadcrumb"><span>Boston region</span><b>/</b><strong id="view-label">Today</strong></div><div class="topbar-actions"><span class="live-pill" id="source-health"><i></i>Checking sources</span><button class="icon-button" id="help-button" aria-label="About Storeline">?</button></div></header>
        <div id="view-root" aria-live="polite"></div>
      </main>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="evidence-drawer" id="evidence-drawer" aria-hidden="true" aria-labelledby="drawer-title">
      <div class="drawer-header"><div><span class="eyebrow" id="drawer-kicker">Decision evidence</span><h2 id="drawer-title">Greek frozen-yogurt pilot</h2></div><button class="icon-button close-drawer" aria-label="Close panel">×</button></div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-footer" id="drawer-footer"></div>
    </aside>

    <div class="toast" id="toast" role="status"></div>

    <template id="today-template">
      <section class="page">
        <div class="page-heading"><div><span class="eyebrow">Monday · Boston region</span><h1>Four decisions need attention.</h1></div><span class="refresh-note">Updated from public sources · Sep 27</span></div>
        <article class="hero-decision">
          <div class="hero-copy">
            <div class="hero-meta"><span class="signal-chip opportunity">Growth opportunity</span><span>86% confidence · Back Bay + Pier 4</span></div>
            <h2>Test Greek frozen yogurt beside afternoon iced drinks.</h2>
            <p>Current category momentum, nearby Greek-food competition and Tatte’s existing yogurt language support a tightly measured 14-day pilot.</p>
            <div class="source-proof"><span><i class="dot coral"></i><b>Reviews</b> lighter options + seating</span><span><i class="dot teal"></i><b>Sales</b> 68% modeled margin</span><span><i class="dot blue"></i><b>Market</b> #froyo posts +16%</span></div>
            <div class="hero-actions"><button class="primary-button" data-open-recommendation="froyo">Review evidence</button><button class="secondary-button" data-view-jump="next">See all next steps</button></div>
          </div>
          <div class="signal-orbit" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="signal-node reviews-node">REVIEWS</div><div class="signal-node price-node">SALES</div><div class="signal-node market-node">MARKET</div><div class="storeline-node"><img class="hub-logo" src="/brand/storeline-favicon.svg" alt="" /><b>STORELINE</b></div></div>
        </article>

        <div class="metric-grid">
          <button class="metric-card" data-view-jump="reviews"><span>Beacon Hill · Yelp</span><strong>4.0</strong><small>763 reviews</small><div class="rating-row">★★★★☆</div></button>
          <button class="metric-card" data-view-jump="reviews"><span>Locations observed</span><strong>10</strong><small>Current Boston Yelp results</small><div class="mini-locations"><i class="risk"></i><i class="stable"></i><i class="strong"></i><i class="stable"></i></div></button>
          <button class="metric-card" data-view-jump="market"><span>Dining inflation</span><strong>+5.1%</strong><small>Boston · year over year</small><svg viewBox="0 0 120 35"><path d="M2 31 C20 27 27 30 42 22 S65 18 76 14 S98 11 118 3"/></svg></button>
          <button class="metric-card" data-view-jump="pricing"><span>Product opportunity</span><strong>68%</strong><small>Modeled pilot margin</small><svg viewBox="0 0 120 35"><path d="M2 29 C19 30 27 24 42 25 S66 17 78 19 S101 9 118 5"/></svg></button>
        </div>

        <div class="location-intelligence-grid">
          <section class="panel location-outlook">
            <div class="panel-heading"><div><span class="eyebrow">Location outlook</span><h3>Current performance and post-pilot target</h3></div><div class="outlook-legend"><span><i></i>Current</span><span><i></i>Post-pilot target</span></div></div>
            <div class="location-score-list">
              <button data-open-location="backbay"><b>Back Bay</b><span class="score-track"><i class="current coral" style="left:32%"></i><i class="target" style="left:53%"></i></span><strong>63</strong><small>Target 74</small></button>
              <button data-open-location="seaport"><b>Pier 4 / Seaport</b><span class="score-track"><i class="current teal" style="left:70%"></i><i class="target" style="left:82%"></i></span><strong>84</strong><small>Target 90</small></button>
              <button data-open-location="cambridge"><b>Cambridge</b><span class="score-track"><i class="current yellow" style="left:41%"></i><i class="target" style="left:56%"></i></span><strong>68</strong><small>Target 76</small></button>
              <button data-open-location="southend"><b>South End</b><span class="score-track"><i class="current green" style="left:84%"></i><i class="target" style="left:91%"></i></span><strong>91</strong><small>Target 95</small></button>
            </div>
          </section>
          <section class="panel signal-connection">
            <div class="panel-heading"><div><span class="eyebrow">Connected evidence</span><h3>How the signals move together</h3></div></div>
            <div class="connection-chain">
              <div><span class="source-mark blue">M</span><p><b>Market</b><small>Greek froyo earns destination trips and nearby competitors expand premium dessert occasions.</small></p></div>
              <i>→</i>
              <div><span class="source-mark coral">R</span><p><b>Reviews</b><small>Guests already reward distinctive flavors but penalize sellouts and inconsistency.</small></p></div>
              <i>→</i>
              <div><span class="source-mark teal">S</span><p><b>Sales</b><small>Protect core drinks, then test a $7.50 afternoon add-on at a modeled 68% margin.</small></p></div>
            </div>
          </section>
        </div>

        <div class="content-grid">
          <section class="panel"><div class="panel-heading"><div><span class="eyebrow">Customer signal</span><h3>What guests are saying</h3></div><button class="text-button" data-view-jump="reviews">Open reviews →</button></div><div class="today-signal-list" id="today-review-list"></div></section>
          <section class="panel"><div class="panel-heading"><div><span class="eyebrow">Outside context</span><h3>What changed</h3></div><button class="text-button" data-view-jump="market">Open market →</button></div><div class="today-market-list" id="today-market-list"></div></section>
        </div>
      </section>
    </template>

    <template id="reviews-template">
      <section class="page">
        <div class="page-heading compact"><div><span class="eyebrow">Customer language</span><h1>Reviews, organized into operating signals.</h1><p>Choose a location to see source-backed comments and recurring themes.</p></div><a class="source-link" href="https://www.yelp.com/search?find_desc=tatte+bakery+%26+cafe&find_loc=Boston%2C+MA" target="_blank" rel="noreferrer">Open Yelp results ↗</a></div>
        <div class="filter-scroller" id="review-location-tabs"></div>
        <section class="location-summary" id="review-summary"></section>
        <section class="ai-synthesis" id="review-synthesis"></section>
        <div class="review-layout"><section class="panel"><div class="panel-heading"><div><span class="eyebrow">Comments</span><h3 id="review-feed-title">All locations</h3></div><span class="period-label">Recent public reviews</span></div><div class="review-feed" id="review-feed"></div></section><aside class="panel cluster-panel"><div class="panel-heading"><div><span class="eyebrow">Themes</span><h3>What repeats</h3></div></div><div class="cluster-list" id="review-clusters"></div></aside></div>
      </section>
    </template>

    <template id="pricing-template">
      <section class="page">
        <div class="page-heading compact"><div><span class="eyebrow">Modeled sales data</span><h1>Sales performance and product mix, by location.</h1><p>A Toast-style operating view of modeled revenue, units, prices, margins and growth signals.</p></div><div class="heading-actions"><span class="scenario-badge">Modeled sales</span><a class="source-link" href="https://tattebakery.com/menu#full-menu" target="_blank" rel="noreferrer">Official menu + photos ↗</a></div></div>
        <div class="filter-row"><div class="filter-scroller" id="pricing-location-tabs"></div><div class="filter-scroller compact-filters" id="pricing-category-tabs"></div></div>
        <div class="metric-grid" id="pricing-kpis"></div>
        <section class="ai-synthesis" id="sales-synthesis"></section>
        <section class="panel pricing-panel"><div class="panel-heading"><div><span class="eyebrow">Product sales</span><h3 id="pricing-table-title">All-location mix</h3></div><span class="period-label">Modeled weekly performance</span></div><div class="product-table"><div class="product-row product-head"><span>Product</span><span>Category</span><span>Price</span><span>Units</span><span>Margin</span><span>Trend</span></div><div id="product-table-body"></div></div></section>
      </section>
    </template>

    <template id="market-template">
      <section class="page">
        <div class="page-heading compact"><div><span class="eyebrow">External market context</span><h1>Demand, costs and nearby competition.</h1><p>Current public evidence, connected to the decisions a location operator can make.</p></div></div>
        <div class="macro-grid" id="macro-grid"></div>
        <section class="ai-synthesis" id="market-synthesis"></section>
        <section class="competitor-scope"><span class="eyebrow">Competitor search scope</span><div><span>Starbucks</span><span>Flour Bakery</span><span>Thinking Cup</span><span>Caffè Nero</span><span>Blue Bottle</span><span>La Colombe</span><span>GRECO</span><span>Local independents</span></div></section>
        <section class="section-block"><div class="section-title"><div><span class="eyebrow">Category movement</span><h2>Signals worth acting on</h2></div></div><div class="trend-grid" id="trend-grid"></div></section>
        <section class="section-block"><div class="section-title"><div><span class="eyebrow">Nearby businesses</span><h2>Competitive clusters</h2></div><span>Each business opens in Google Maps</span></div><div class="filter-scroller" id="market-location-tabs"></div><div class="competitor-grid" id="competitor-grid"></div></section>
      </section>
    </template>

    <template id="next-template">
      <section class="page">
        <div class="page-heading compact"><div><span class="eyebrow">This is what you should do next</span><h1>Prioritized actions, with the proof attached.</h1><p>Review the evidence, assign an owner and keep the decision trail in one place.</p></div><div class="decision-summary"><span><b id="open-decision-count">4</b>Open</span><span><b id="approved-decision-count">0</b>Approved</span></div></div>
        <div class="decision-filters">
          <label><span>Location</span><select id="decision-location-filter"><option value="all">All locations</option><option value="backbay">Back Bay</option><option value="seaport">Pier 4 / Seaport</option><option value="beacon">Beacon Hill</option><option value="cambridge">Cambridge</option></select></label>
          <label><span>Decision type</span><select id="decision-type-filter"><option value="all">All types</option><option value="Growth">Growth</option><option value="Operations">Operations</option><option value="Quality">Quality</option><option value="Revenue">Revenue</option></select></label>
          <button class="text-button" id="clear-decision-filters">Clear filters</button>
        </div>
        <div class="decision-list" id="recommendation-list"></div>
      </section>
    </template>

    <template id="assistant-template">
      <section class="page assistant-page">
        <div class="page-heading compact"><div><span class="eyebrow">Grounded operating assistant</span><h1>Ask anything. Then turn the answer into work.</h1><p>Every response retrieves reviews, product economics and current market sources before it proposes an action.</p></div><span class="connected-badge" id="connection-badge"><i></i>Connecting evidence</span></div>
        <div class="runtime-strip" id="runtime-strip"><span>Loading evidence coverage…</span></div>
        <div class="assistant-layout">
          <section class="assistant-chat panel">
            <div class="assistant-header"><div class="assistant-avatar">S</div><div><strong>Storeline Assistant</strong><span id="assistant-status-line">Reviews · Sales · Market</span></div><button class="text-button" id="clear-chat">Clear</button></div>
            <div class="chat-thread" id="chat-thread"></div>
            <div class="prompt-chips"><button data-prompt="Why should we test Greek frozen yogurt?">Why froyo?</button><button data-prompt="Which location should run the pilot first?">Best pilot location?</button><button data-prompt="What sales and pricing risks should I watch?">Sales risks?</button></div>
            <form class="chat-compose" id="chat-form"><input id="chat-input" autocomplete="off" placeholder="Ask about reviews, sales, competitors or the next move…"/><button type="submit" aria-label="Send question">↑</button></form>
          </section>
          <aside class="agent-workspace panel">
            <div class="agent-workspace-head"><div><span class="eyebrow">Agentic playbook</span><h2>Greek froyo launch</h2></div><span class="workflow-status" id="workflow-status">Ready</span></div>
            <p class="workspace-intro">One approval turns the recommendation into a researched launch package for Back Bay and Pier 4.</p>
            <div class="workflow-list" id="workflow-list">
              <div class="workflow-step"><span>01</span><div><strong>Research nearby winners</strong><small>Menus, positioning, price points and offers</small></div><i>○</i></div>
              <div class="workflow-step"><span>02</span><div><strong>Build the offer</strong><small>Product, price, margin and test design</small></div><i>○</i></div>
              <div class="workflow-step"><span>03</span><div><strong>Create the campaign</strong><small>Brief, launch copy, email and social assets</small></div><i>○</i></div>
              <div class="workflow-step"><span>04</span><div><strong>Prepare store operations</strong><small>Manager checklist and measurement plan</small></div><i>○</i></div>
            </div>
            <div class="artifact-stack" id="artifact-stack" hidden></div>
            <button class="primary-button run-playbook" id="run-playbook">Run the froyo playbook</button>
          </aside>
        </div>
      </section>
    </template>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
